name: CI/CD Pipeline - SmileLink

# Trigger limitado para no agotar los minutos gratuitos de Actions:
#  - Solo corre en push a main y en pull requests hacia main (no en cada push a cada rama).
#  - Se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
#  - No corre si solo cambian documentos o la app Android.
#  - Si llega un push nuevo a la misma rama/PR, cancela la ejecución anterior.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "android_app/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "android_app/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1: BACKEND (Django / Python)
  # =========================================================================
  backend:
    name: Backend CI (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PASO 1: Descarga de código fuente
      - name: 1. Descarga de código fuente del repositorio
        uses: actions/checkout@v4

      # PASO 2: Configuración del entorno y dependencias
      - name: 2a. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend_django/requirements.txt'

      - name: 2b. Instalar librerías del sistema (MySQL client)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: 2c. Instalar dependencias de Python y herramientas
        working-directory: backend_django
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage bandit pip-audit
          pip install -r requirements.txt

      # PASO 3: Pruebas unitarias (con medición de cobertura)
      - name: 3. Ejecutar pruebas unitarias (Django)
        working-directory: backend_django
        env:
          USE_SQLITE: "True"
        run: |
          coverage run manage.py test api.tests --verbosity=2

      # PASO 4: Pruebas de integración (flujos de API y reglas de negocio)
      - name: 4a. Ejecutar pruebas de integración y de vistas (Django REST Framework)
        working-directory: backend_django
        env:
          USE_SQLITE: "True"
        run: |
          coverage run --append manage.py test api.test_integration api.test_views api.test_jwt --verbosity=2

      - name: 4b. Verificar cobertura mínima de pruebas
        working-directory: backend_django
        run: |
          # El umbral (fail_under) se define en backend_django/.coveragerc
          coverage report

      # PASO 5: Análisis estático de código (Linting)
      - name: 5a. Flake8 - errores de sintaxis y nombres no definidos (bloqueante)
        working-directory: backend_django
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,staticfiles

      - name: 5b. Flake8 - calidad y complejidad (informativo)
        working-directory: backend_django
        continue-on-error: true
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,staticfiles

      # PASO 6: Análisis de vulnerabilidades (Seguridad)
      - name: 6a. Bandit SAST - hallazgos de severidad media/alta (bloqueante)
        working-directory: backend_django
        run: |
          # Inyección SQL, secretos en código, criptografía débil, etc.
          bandit -r . -x ./venv,./staticfiles,./api/migrations -ll -ii

      - name: 6b. pip-audit - vulnerabilidades en dependencias (informativo)
        working-directory: backend_django
        # Informativo: las versiones fijadas en requirements.txt tienen CVEs conocidos.
        # El paso aparece en amarillo/rojo en el resumen del job sin bloquear el pipeline.
        # Cuando se actualicen las dependencias, quitar continue-on-error para volverlo bloqueante.
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --desc

      # PASO 7a: Compilación de estáticos
      - name: 7a. Compilación de estáticos (Django collectstatic)
        working-directory: backend_django
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py collectstatic --noinput

  # =========================================================================
  # JOB 2: FRONTEND (React / Node.js)
  # =========================================================================
  frontend:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PASO 1: Descarga de código fuente
      - name: 1. Descarga de código fuente del repositorio
        uses: actions/checkout@v4

      # PASO 2: Configuración del entorno y dependencias
      - name: 2a. Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend_react/package-lock.json'

      - name: 2b. Instalar dependencias de Node (npm ci)
        working-directory: frontend_react
        run: |
          npm ci

      # PASO 3: Pruebas unitarias (Vitest, importan el código real de src/)
      - name: 3. Ejecutar pruebas unitarias (Vitest)
        working-directory: frontend_react
        run: |
          npm run test:unit

      # PASO 4: Pruebas de integración (servicios API, rutas protegidas)
      - name: 4a. Ejecutar pruebas de integración (Vitest)
        working-directory: frontend_react
        run: |
          npm run test:integration

      - name: 4b. Verificar cobertura mínima de pruebas
        working-directory: frontend_react
        run: |
          # El umbral se define en frontend_react/vitest.config.ts
          npm run test:coverage

      # PASO 5: Análisis estático de código
      - name: 5a. Revisión de tipos (TypeScript)
        working-directory: frontend_react
        run: |
          npx tsc -p tsconfig.app.json --noEmit

      - name: 5b. Análisis estático de código (ESLint)
        working-directory: frontend_react
        run: |
          npm run lint

      # PASO 6: Análisis de vulnerabilidades (Seguridad)
      - name: 6a. npm audit - dependencias de producción críticas (bloqueante)
        working-directory: frontend_react
        run: |
          npm audit --omit=dev --audit-level=critical

      - name: 6b. npm audit - todas las dependencias, severidad alta (informativo)
        working-directory: frontend_react
        # Informativo: hay vulnerabilidades altas pendientes de actualizar.
        # Quitar continue-on-error cuando se resuelvan.
        continue-on-error: true
        run: |
          npm audit --audit-level=high

      # PASO 7: Compilación del proyecto
      - name: 7a. Compilación del proyecto (Vite build)
        working-directory: frontend_react
        run: |
          npm run build

      - name: 7b. Publicar artefacto de compilación descargable
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: frontend_react/dist/
          retention-days: 7

  # =========================================================================
  # JOB 3: EMPAQUETADO DOCKER Y PUBLICACIÓN (solo main, tras pasar las pruebas)
  # =========================================================================
  docker:
    name: Empaquetado Docker y publicación en GHCR
    needs: [backend, frontend]
    # Solo en main: evita gastar minutos construyendo imágenes en cada pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: 1. Descarga de código fuente del repositorio
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 3. Construir y publicar imagen del backend
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}/backend:latest -t ghcr.io/${REPO_LOWER}/backend:${{ github.sha }} ./backend_django
          docker push ghcr.io/${REPO_LOWER}/backend:latest
          docker push ghcr.io/${REPO_LOWER}/backend:${{ github.sha }}

      - name: 4. Construir y publicar imagen del frontend
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}/frontend:latest -t ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }} ./frontend_react
          docker push ghcr.io/${REPO_LOWER}/frontend:latest
          docker push ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }}
