name: CI/CD Pipeline - SmileLink

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # =========================================================================
  # JOB 1: BACKEND (Django / Python)
  # =========================================================================
  backend:
    name: Backend CI (Django)
    runs-on: ubuntu-latest
    steps:
      # PASO 1: Descarga de código fuente
      - name: 1. Descarga de código fuente del repositorio
        uses: actions/checkout@v4

      # PASO 2: Configuración del entorno y dependencias
      - name: 2a. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend_django/requirements.txt'

      - name: 2b. Instalar librerías del sistema (MySQL client)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: 2c. Instalar dependencias de Python y Linter
        working-directory: backend_django
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      # PASO 3: Ejecución de pruebas unitarias
      - name: 3. Ejecutar pruebas unitarias (Django)
        working-directory: backend_django
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py test api.tests --verbosity=2

      # PASO 4: Ejecución de pruebas de integración
      - name: 4. Ejecutar pruebas de integración (Django REST Framework)
        working-directory: backend_django
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py test api.test_integration --verbosity=2

      # PASO 5: Análisis estático de código (Linting)
      - name: 5. Análisis estático de código (Flake8)
        working-directory: backend_django
        run: |
          # Detiene la pipeline si hay errores de sintaxis Python o nombres no definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv
          # Análisis de calidad de código y complejidad ciclomática
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv

      # PASO 6: Análisis de Vulnerabilidades (Seguridad)
      - name: 6a. Instalar herramientas de escaneo de vulnerabilidades
        working-directory: backend_django
        run: |
          python -m pip install pip-audit bandit

      - name: 6b. Análisis de vulnerabilidades en dependencias (pip-audit)
        working-directory: backend_django
        run: |
          # Escanea requirements.txt contra la base de datos de vulnerabilidades PyPA/OSV
          pip-audit -r requirements.txt --desc || true

      - name: 6c. Análisis de vulnerabilidades en código fuente (Bandit SAST)
        working-directory: backend_django
        run: |
          # Escanea vulnerabilidades como inyección SQL, hardcoded secrets o criptografía débil
          bandit -r . -x ./venv,./api/migrations -ll -ii || true

  # =========================================================================
  # JOB 2: FRONTEND (React / Node.js)
  # =========================================================================
  frontend:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    steps:
      # PASO 1: Descarga de código fuente
      - name: 1. Descarga de código fuente del repositorio
        uses: actions/checkout@v4

      # PASO 2: Configuración del entorno y dependencias
      - name: 2a. Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend_react/package-lock.json'

      - name: 2b. Instalar dependencias de Node (npm ci)
        working-directory: frontend_react
        run: |
          npm ci

      # PASO 3: Ejecución de pruebas unitarias
      - name: 3. Ejecutar pruebas unitarias (Node.js)
        working-directory: frontend_react
        run: |
          npm run test:unit

      # PASO 4: Ejecución de pruebas de integración
      - name: 4. Ejecutar pruebas de integración (Node.js)
        working-directory: frontend_react
        run: |
          npm run test:integration

      # PASO 5: Análisis estático de código (Linting)
      - name: 5. Análisis estático de código (ESLint)
        working-directory: frontend_react
        run: |
          npm run lint

      # PASO 6: Análisis de Vulnerabilidades (Seguridad)
      - name: 6. Análisis de vulnerabilidades en dependencias (npm audit)
        working-directory: frontend_react
        run: |
          # Escanea vulnerabilidades conocidas en paquetes npm contra GitHub Advisory Database
          npm audit --audit-level=critical || true
